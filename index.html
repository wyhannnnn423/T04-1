<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T04 – SVG House &amp; Garden</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            background: #eef4f7;
            color: #24323a;
            font-family: Georgia, "Times New Roman", serif;
        }
        
        main {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
        }
        
        svg {
            display: block;
            width: 100%;
            height: auto;
            border: 3px solid #49636d;
            border-radius: 8px;
            background: #9bd7f0;
        }
        
        #scene-annotated #annotations {
            font-size: 12px;
            fill: #333;
            stroke: #999;
            stroke-width: 1;
        }
        
        #scene-annotated #annotations text,
        #scene-annotated #annotations line {
            pointer-events: none;
        }
        
        #scene-adjusted #smoke {
            fill: #d7e0e2;
            stroke: #77858a;
            stroke-width: 1;
        }
        
        #scene-adjusted #mailbox {
            fill: #315b72;
            stroke: #1e3847;
            stroke-width: 2;
        }
    </style>
</head>

<body>
    <main>
        <h1>T04 – SVG House &amp; Garden</h1>

        <figure id="scene-original">
            <svg viewBox="0 0 800 500" role="img" aria-labelledby="svg-title svg-desc">
			<title id="svg-title">A house and garden scene</title>
			<desc id="svg-desc">A sunny garden with a cloud, tree, fenced house, curved path, and caption.</desc>

			<!-- Sky and grass -->
			<rect x="0" y="0" width="800" height="340" fill="#9bd7f0"></rect>
			<rect x="0" y="340" width="800" height="160" fill="#83bd68"></rect>

			<!-- Sun and cloud -->
			<circle cx="680" cy="92" r="48" fill="#ffd35a"></circle>
			<ellipse cx="180" cy="105" rx="70" ry="28" fill="#ffffff"></ellipse>
			<circle cx="135" cy="102" r="30" fill="#ffffff"></circle>
			<circle cx="215" cy="97" r="36" fill="#ffffff"></circle>

			<!-- Tree -->
			<rect x="90" y="250" width="30" height="115" fill="#7b5035"></rect>
			<circle cx="105" cy="210" r="65" fill="#4d9b57"></circle>
			<circle cx="58" cy="237" r="45" fill="#5eaa5e"></circle>
			<circle cx="155" cy="238" r="48" fill="#438e50"></circle>

			<!-- House body, roof, and chimney -->
			<rect x="285" y="235" width="270" height="170" fill="#f2c078" stroke="#714b37" stroke-width="4"></rect>
			<polygon points="260,240 420,115 580,240" fill="#b9574b" stroke="#714b37" stroke-width="4"></polygon>
			<rect x="480" y="145" width="34" height="78" fill="#8d5545" stroke="#714b37" stroke-width="4"></rect>

			<!-- Door and windows -->
			<rect x="390" y="315" width="60" height="90" fill="#704b3b" stroke="#4e352b" stroke-width="4"></rect>
			<circle cx="438" cy="362" r="5" fill="#f6d36d"></circle>
			<rect x="315" y="275" width="55" height="50" fill="#94d6e8" stroke="#4e6b73" stroke-width="4"></rect>
			<line x1="342.5" y1="275" x2="342.5" y2="325" stroke="#4e6b73" stroke-width="3"></line>
			<line x1="315" y1="300" x2="370" y2="300" stroke="#4e6b73" stroke-width="3"></line>
			<rect x="475" y="275" width="55" height="50" fill="#94d6e8" stroke="#4e6b73" stroke-width="4"></rect>
			<line x1="502.5" y1="275" x2="502.5" y2="325" stroke="#4e6b73" stroke-width="3"></line>
			<line x1="475" y1="300" x2="530" y2="300" stroke="#4e6b73" stroke-width="3"></line>

			<!-- Fence -->
			<polyline points="30,395 30,345 55,395 55,345 80,395 80,345 105,395 105,345 130,395 130,345 155,395" fill="none" stroke="#f3e0ad" stroke-width="8" stroke-linejoin="round"></polyline>
			<line x1="20" y1="370" x2="165" y2="370" stroke="#c89d5b" stroke-width="7"></line>
			<line x1="20" y1="395" x2="165" y2="395" stroke="#c89d5b" stroke-width="7"></line>

			<!-- Curved garden path -->
			<path d="M 420 405 C 410 430, 350 442, 330 500 L 520 500 C 500 450, 465 430, 450 405 Z" fill="#e4c58e" stroke="#b18d5e" stroke-width="3"></path>

			<!-- Garden details and caption -->
			<ellipse cx="650" cy="410" rx="62" ry="18" fill="#4f963f"></ellipse>
			<circle cx="625" cy="393" r="10" fill="#e85b63"></circle>
			<circle cx="650" cy="387" r="10" fill="#f6c74d"></circle>
			<circle cx="675" cy="394" r="10" fill="#d86bd1"></circle>
			<text x="400" y="475" text-anchor="middle" fill="#405d39" font-size="22" font-weight="bold">Welcome to our garden</text>
            </svg>
            <figcaption>Original scene</figcaption>
        </figure>

        <figure id="scene-annotated-figure">
            <svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="svg-title-annotated svg-desc-annotated">
			<title id="svg-title-annotated">An annotated house and garden scene</title>
			<desc id="svg-desc-annotated">The original house and garden scene with labels showing SVG shape attributes.</desc>

			<!-- Sky and grass -->
			<rect x="0" y="0" width="800" height="340" fill="#9bd7f0"></rect>
			<rect x="0" y="340" width="800" height="160" fill="#83bd68"></rect>

			<!-- Sun and cloud -->
			<circle cx="680" cy="92" r="48" fill="#ffd35a"></circle>
			<ellipse cx="180" cy="105" rx="70" ry="28" fill="#ffffff"></ellipse>
			<circle cx="135" cy="102" r="30" fill="#ffffff"></circle>
			<circle cx="215" cy="97" r="36" fill="#ffffff"></circle>

			<!-- Tree -->
			<rect x="90" y="250" width="30" height="115" fill="#7b5035"></rect>
			<circle cx="105" cy="210" r="65" fill="#4d9b57"></circle>
			<circle cx="58" cy="237" r="45" fill="#5eaa5e"></circle>
			<circle cx="155" cy="238" r="48" fill="#438e50"></circle>

			<!-- House body, roof, and chimney -->
			<rect x="285" y="235" width="270" height="170" fill="#f2c078" stroke="#714b37" stroke-width="4"></rect>
			<polygon points="260,240 420,115 580,240" fill="#b9574b" stroke="#714b37" stroke-width="4"></polygon>
			<rect x="480" y="145" width="34" height="78" fill="#8d5545" stroke="#714b37" stroke-width="4"></rect>

			<!-- Door and windows -->
			<rect x="390" y="315" width="60" height="90" fill="#704b3b" stroke="#4e352b" stroke-width="4"></rect>
			<circle cx="438" cy="362" r="5" fill="#f6d36d"></circle>
			<rect x="315" y="275" width="55" height="50" fill="#94d6e8" stroke="#4e6b73" stroke-width="4"></rect>
			<line x1="342.5" y1="275" x2="342.5" y2="325" stroke="#4e6b73" stroke-width="3"></line>
			<line x1="315" y1="300" x2="370" y2="300" stroke="#4e6b73" stroke-width="3"></line>
			<rect x="475" y="275" width="55" height="50" fill="#94d6e8" stroke="#4e6b73" stroke-width="4"></rect>
			<line x1="502.5" y1="275" x2="502.5" y2="325" stroke="#4e6b73" stroke-width="3"></line>
			<line x1="475" y1="300" x2="530" y2="300" stroke="#4e6b73" stroke-width="3"></line>

			<!-- Fence -->
			<polyline points="30,395 30,345 55,395 55,345 80,395 80,345 105,395 105,345 130,395 130,345 155,395" fill="none" stroke="#f3e0ad" stroke-width="8" stroke-linejoin="round"></polyline>
			<line x1="20" y1="370" x2="165" y2="370" stroke="#c89d5b" stroke-width="7"></line>
			<line x1="20" y1="395" x2="165" y2="395" stroke="#c89d5b" stroke-width="7"></line>

			<!-- Curved garden path -->
			<path d="M 420 405 C 410 430, 350 442, 330 500 L 520 500 C 500 450, 465 430, 450 405 Z" fill="#e4c58e" stroke="#b18d5e" stroke-width="3"></path>

			<!-- Garden details and caption -->
			<ellipse cx="650" cy="410" rx="62" ry="18" fill="#4f963f"></ellipse>
			<circle cx="625" cy="393" r="10" fill="#e85b63"></circle>
			<circle cx="650" cy="387" r="10" fill="#f6c74d"></circle>
			<circle cx="675" cy="394" r="10" fill="#d86bd1"></circle>
			<text x="400" y="475" text-anchor="middle" fill="#405d39" font-size="22" font-weight="bold">Welcome to our garden</text>

            <g id="annotations" aria-label="Shape attribute annotations">
                <line x1="680" y1="92" x2="600" y2="48"></line>
                <text x="490" y="45">circle (cx=680, cy=92, r=48)</text>

                <line x1="285" y1="235" x2="175" y2="255"></line>
                <text x="35" y="255">rect (x=285, y=235, width=270, height=170)</text>

                <line x1="180" y1="105" x2="180" y2="155"></line>
                <text x="205" y="160">ellipse (cx=180, cy=105, rx=70, ry=28)</text>

                <line x1="342.5" y1="275" x2="245" y2="285"></line>
                <text x="35" y="285">line (342.5, 275) -&gt; (342.5, 325)</text>

                <line x1="55" y1="395" x2="175" y2="420"></line>
                <text x="180" y="425">polyline (30,395 30,345 55,395)</text>

                <line x1="420" y1="115" x2="590" y2="105"></line>
                <text x="595" y="110">polygon (260,240 420,115 580,240)</text>

                <line x1="420" y1="405" x2="570" y2="455"></line>
                <text x="575" y="460">path (M 420 405 C 410 430 ... L 520 500)</text>

                <line x1="400" y1="475" x2="265" y2="465"></line>
                <text x="35" y="465">text (x=400, y=475)</text>
            </g>
		</svg>
            <figcaption>Annotated scene (Step 2)</figcaption>
        </figure>

        <figure id="scene-adjusted-figure">
            <svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="svg-title-adjusted svg-desc-adjusted">
				<title id="svg-title-adjusted">An adjusted house and garden scene</title>
				<desc id="svg-desc-adjusted">A balanced house and garden scene with stronger contrast, a dashed fence, a stone path, mailbox, and chimney smoke.</desc>

				<!-- Keep the original sky and grass scale while strengthening contrast. -->
				<rect x="0" y="0" width="800" height="340" fill="#8fcfe9"></rect>
				<rect x="0" y="340" width="800" height="160" fill="#6fa957"></rect>

				<!-- Sun and cloud retain their original positions. -->
				<circle cx="680" cy="92" r="48" fill="#ffc928" stroke="#9a6815" stroke-width="2"></circle>
				<ellipse cx="180" cy="105" rx="70" ry="28" fill="#ffffff" stroke="#b8cbd1" stroke-width="1"></ellipse>
				<circle cx="135" cy="102" r="30" fill="#ffffff" stroke="#b8cbd1" stroke-width="1"></circle>
				<circle cx="215" cy="97" r="36" fill="#ffffff" stroke="#b8cbd1" stroke-width="1"></circle>

				<!-- Slightly shift the tree left to balance the house. -->
				<g id="tree-adjusted" transform="translate(-10 0)">
					<rect x="90" y="250" width="30" height="115" fill="#6b432d" stroke="#422b20" stroke-width="3"></rect>
					<circle cx="105" cy="210" r="65" fill="#367c42" stroke="#24552d" stroke-width="3"></circle>
					<circle cx="58" cy="237" r="45" fill="#438e4b" stroke="#24552d" stroke-width="2"></circle>
					<circle cx="155" cy="238" r="48" fill="#2f713b" stroke="#24552d" stroke-width="2"></circle>
				</g>

				<!-- Slightly shift the house right for a more balanced composition. -->
				<g id="house-adjusted" transform="translate(15 0)">
					<rect x="285" y="235" width="270" height="170" fill="#f5c16d" stroke="#5b3828" stroke-width="5"></rect>
					<polygon points="260,240 420,115 580,240" fill="#a83f38" stroke="#5b3828" stroke-width="5"></polygon>
					<rect x="480" y="145" width="34" height="78" fill="#744033" stroke="#4a2922" stroke-width="3"></rect>

					<!-- Door and windows use varied stroke widths for clearer contrast. -->
					<rect x="390" y="315" width="60" height="90" fill="#58362b" stroke="#321f1a" stroke-width="5"></rect>
					<circle cx="438" cy="362" r="5" fill="#f8d65f"></circle>
					<rect x="315" y="275" width="55" height="50" fill="#81c9df" stroke="#294e5a" stroke-width="4"></rect>
					<line x1="342.5" y1="275" x2="342.5" y2="325" stroke="#294e5a" stroke-width="2"></line>
					<line x1="315" y1="300" x2="370" y2="300" stroke="#294e5a" stroke-width="2"></line>
					<rect x="475" y="275" width="55" height="50" fill="#81c9df" stroke="#294e5a" stroke-width="4"></rect>
					<line x1="502.5" y1="275" x2="502.5" y2="325" stroke="#294e5a" stroke-width="2"></line>
					<line x1="475" y1="300" x2="530" y2="300" stroke="#294e5a" stroke-width="2"></line>
				</g>

				<!-- Make the fence easier to read with a dashed, varied-weight stroke. -->
				<polyline points="30,395 30,345 55,395 55,345 80,395 80,345 105,395 105,345 130,395 130,345 155,395" fill="none" stroke="#f8e7b4" stroke-width="6" stroke-dasharray="12 5" stroke-linejoin="round"></polyline>
				<line x1="20" y1="370" x2="165" y2="370" stroke="#a87536" stroke-width="5" stroke-dasharray="10 4"></line>
				<line x1="20" y1="395" x2="165" y2="395" stroke="#a87536" stroke-width="5" stroke-dasharray="10 4"></line>

				<!-- Add a curved stone footpath that leads directly to the door. -->
				<path d="M 420 405 C 410 430, 350 442, 330 500 L 520 500 C 500 450, 465 430, 450 405 Z" fill="#d9b978" stroke="#87663d" stroke-width="4"></path>
				<path d="M 420 420 C 405 438, 380 450, 370 475" fill="none" stroke="#f0d69d" stroke-width="5" stroke-dasharray="2 12"></path>

				<!-- Add a small mailbox beside the new path. -->
				<g id="mailbox">
					<rect x="245" y="350" width="38" height="28" rx="4" ry="4"></rect>
					<polygon points="245,350 264,335 283,350"></polygon>
					<rect x="261" y="378" width="5" height="28"></rect>
				</g>

				<!-- Add a subtle puff of smoke above the chimney. -->
				<g id="smoke">
					<ellipse cx="500" cy="125" rx="13" ry="9"></ellipse>
					<ellipse cx="515" cy="102" rx="16" ry="11"></ellipse>
					<ellipse cx="505" cy="76" rx="11" ry="8"></ellipse>
				</g>

				<!-- Retain the garden details and caption. -->
				<ellipse cx="650" cy="410" rx="62" ry="18" fill="#438b35" stroke="#286226" stroke-width="2"></ellipse>
				<circle cx="625" cy="393" r="10" fill="#d94351" stroke="#8b2530" stroke-width="1"></circle>
				<circle cx="650" cy="387" r="10" fill="#efb82e" stroke="#8b6814" stroke-width="1"></circle>
				<circle cx="675" cy="394" r="10" fill="#bd52b8" stroke="#743272" stroke-width="1"></circle>
				<text x="400" y="475" text-anchor="middle" fill="#294b24" font-size="22" font-weight="bold">Welcome to our garden</text>
			</svg>
            <figcaption>Adjusted scene (Step 3)</figcaption>
        </figure>

        <figure id="scene-grouped-figure">
            <svg id="scene-grouped" viewBox="0 0 800 500" role="img" aria-labelledby="svg-title-grouped svg-desc-grouped">
				<title id="svg-title-grouped">A house and garden scene with grouped windows</title>
				<desc id="svg-desc-grouped">The house and garden scene with both windows created from one reusable SVG group.</desc>

				<defs>
					<!-- Grouping the window parts keeps both windows consistent and easy to update. -->
					<g id="window">
						<rect x="0" y="0" width="35" height="30" fill="#94d6e8" stroke="#4e6b73" stroke-width="4"></rect>
						<line x1="17.5" y1="0" x2="17.5" y2="30" stroke="#4e6b73" stroke-width="3"></line>
						<line x1="0" y1="15" x2="35" y2="15" stroke="#4e6b73" stroke-width="3"></line>
					</g>
				</defs>

				<!-- Sky and grass -->
				<rect x="0" y="0" width="800" height="340" fill="#9bd7f0"></rect>
				<rect x="0" y="340" width="800" height="160" fill="#83bd68"></rect>

				<!-- Sun and cloud -->
				<circle cx="680" cy="92" r="48" fill="#ffd35a"></circle>
				<ellipse cx="180" cy="105" rx="70" ry="28" fill="#ffffff"></ellipse>
				<circle cx="135" cy="102" r="30" fill="#ffffff"></circle>
				<circle cx="215" cy="97" r="36" fill="#ffffff"></circle>

				<!-- Tree -->
				<rect x="90" y="250" width="30" height="115" fill="#7b5035"></rect>
				<circle cx="105" cy="210" r="65" fill="#4d9b57"></circle>
				<circle cx="58" cy="237" r="45" fill="#5eaa5e"></circle>
				<circle cx="155" cy="238" r="48" fill="#438e50"></circle>

				<!-- House body, roof, and chimney -->
				<rect x="285" y="235" width="270" height="170" fill="#f2c078" stroke="#714b37" stroke-width="4"></rect>
				<polygon points="260,240 420,115 580,240" fill="#b9574b" stroke="#714b37" stroke-width="4"></polygon>
				<rect x="480" y="145" width="34" height="78" fill="#8d5545" stroke="#714b37" stroke-width="4"></rect>

				<!-- Reuse the grouped 35x30 window at the original window positions. -->
				<rect x="390" y="315" width="60" height="90" fill="#704b3b" stroke="#4e352b" stroke-width="4"></rect>
				<circle cx="438" cy="362" r="5" fill="#f6d36d"></circle>
				<use href="#window" transform="translate(315 275)"></use>
				<use href="#window" transform="translate(475 275)"></use>

				<!-- Fence -->
				<polyline points="30,395 30,345 55,395 55,345 80,395 80,345 105,395 105,345 130,395 130,345 155,395" fill="none" stroke="#f3e0ad" stroke-width="8" stroke-linejoin="round"></polyline>
				<line x1="20" y1="370" x2="165" y2="370" stroke="#c89d5b" stroke-width="7"></line>
				<line x1="20" y1="395" x2="165" y2="395" stroke="#c89d5b" stroke-width="7"></line>

				<!-- Curved garden path -->
				<path d="M 420 405 C 410 430, 350 442, 330 500 L 520 500 C 500 450, 465 430, 450 405 Z" fill="#e4c58e" stroke="#b18d5e" stroke-width="3"></path>

				<!-- Garden details and caption -->
				<ellipse cx="650" cy="410" rx="62" ry="18" fill="#4f963f"></ellipse>
				<circle cx="625" cy="393" r="10" fill="#e85b63"></circle>
				<circle cx="650" cy="387" r="10" fill="#f6c74d"></circle>
				<circle cx="675" cy="394" r="10" fill="#d86bd1"></circle>
				<text x="400" y="475" text-anchor="middle" fill="#405d39" font-size="22" font-weight="bold">Welcome to our garden</text>
			</svg>
            <figcaption>Grouped windows scene (Step 4)</figcaption>
        </figure>
    </main>
</body>

</html>
